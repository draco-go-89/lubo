<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Kaleidoscope Studio Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020205;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: crosshair;
        }

        /* Modern Minimalist HUD Control Pod */
        .hud {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 28px;
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 14px 32px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        .hud-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hud-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.12);
            height: 4px;
            border-radius: 2px;
            outline: none;
            width: 90px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        .btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 30px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        #exportBtn {
            background: linear-gradient(135deg, rgba(0, 255, 242, 0.2), rgba(112, 0, 255, 0.2));
            border: 1px solid rgba(0, 255, 242, 0.3);
            color: #00ffff;
            text-shadow: 0 0 8px rgba(0, 255, 242, 0.4);
        }

        #exportBtn:hover {
            background: linear-gradient(135deg, rgba(0, 255, 242, 0.35), rgba(112, 0, 255, 0.35));
            border-color: rgba(0, 255, 242, 0.6);
            box-shadow: 0 0 15px rgba(0, 255, 242, 0.3);
        }

        .prompt {
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            pointer-events: none;
            animation: pulse 2.5s infinite ease-in-out;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.25;
            }

            50% {
                opacity: 0.6;
            }
        }
    </style>
</head>

<body>

    <div class="prompt">Drag across the workspace to create illuminated geometry</div>

    <div class="hud">
        <div class="hud-section">
            <span class="hud-label">Symmetry</span>
            <input type="range" id="slices" min="4" max="24" value="12" step="2">
        </div>

        <div class="hud-section">
            <span class="hud-label">Glow Size</span>
            <input type="range" id="thickness" min="2" max="16" value="4" step="0.5">
        </div>

        <button class="btn" id="clearBtn">Clear</button>
        <button class="btn" id="exportBtn">Export PNG</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let symmetry = 12;
        let brushWeight = 4;
        let isDrawing = false;
        let hueCycle = 0;
        let lastX = 0, lastY = 0;

        // --- POLYPHONIC CRYSTAL CHIME OSCILLATOR ENGINE ---
        let audioCtx = null;
        let mainGain = null;
        const pentatonicScale = [130.81, 146.83, 164.81, 196.00, 220.00, 261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33];

        function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                mainGain = audioCtx.createGain();
                mainGain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                mainGain.connect(audioCtx.destination);
            } catch (e) {
                console.warn("Audio Context blocked.");
            }
        }

        function playHarmonicTone(x, y, velocity) {
            if (!audioCtx || audioCtx.state === 'suspended') return;
            try {
                const normY = 1 - (y / canvas.height);
                const noteIndex = Math.floor(normY * pentatonicScale.length);
                const freq = pentatonicScale[Math.min(noteIndex, pentatonicScale.length - 1)];

                const osc = audioCtx.createOscillator();
                const oscGain = audioCtx.createGain();

                osc.type = velocity > 25 ? 'triangle' : 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                const delay = audioCtx.createDelay();
                const delayGain = audioCtx.createGain();
                delay.delayTime.setValueAtTime(0.28, audioCtx.currentTime);
                delayGain.gain.setValueAtTime(0.35, audioCtx.currentTime);

                osc.connect(oscGain);
                oscGain.connect(mainGain);
                oscGain.connect(delay);
                delay.connect(delayGain);
                delayGain.connect(mainGain);

                const now = audioCtx.currentTime;
                oscGain.gain.setValueAtTime(0, now);
                oscGain.gain.linearRampToValueAtTime(0.4, now + 0.03);
                oscGain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

                osc.start(now);
                osc.stop(now + 1.3);
            } catch (err) { }
        }

        // --- PRODUCTION STABLE NEON RENDERING FRAMEWORK ---
        function clearCanvasWithSolidBackground() {
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#020205';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function setCanvasDimensions() {
            canvas.width = window.innerWidth || window.screen.width;
            canvas.height = window.innerHeight || window.screen.height;
            clearCanvasWithSolidBackground();
        }

        window.addEventListener('resize', setCanvasDimensions);
        window.addEventListener('load', setCanvasDimensions);

        // Immediate fallback setup if dimensions load slow
        setCanvasDimensions();

        function drawMirroredGeometry(x1, y1, x2, y2) {
            const cX = canvas.width / 2;
            const cY = canvas.height / 2;

            const rX1 = x1 - cX;
            const rY1 = y1 - cY;
            const rX2 = x2 - cX;
            const rY2 = y2 - cY;

            const sliceAngle = (Math.PI * 2) / symmetry;

            ctx.save();
            ctx.translate(cX, cY);

            ctx.globalCompositeOperation = 'screen';
            ctx.strokeStyle = `hsl(${hueCycle}, 95%, 60%)`;
            ctx.lineWidth = brushWeight;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.shadowBlur = brushWeight * 3;
            ctx.shadowColor = `hsl(${hueCycle}, 100%, 55%)`;

            for (let i = 0; i < symmetry; i++) {
                ctx.rotate(sliceAngle);

                ctx.beginPath();
                ctx.moveTo(rX1, rY1);
                ctx.lineTo(rX2, rY2);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(rX1, -rY1);
                ctx.lineTo(rX2, -rY2);
                ctx.stroke();
            }

            ctx.restore();
            hueCycle = (hueCycle + 0.5) % 360;
        }

        // --- ROUTED GESTURE SYSTEM INTERFACE ---
        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('.hud')) return;

            if (!audioCtx) initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            isDrawing = true;
            lastX = e.clientX;
            lastY = e.clientY;

            playHarmonicTone(e.clientX, e.clientY, 0);
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;

            const speedVec = Math.sqrt(Math.pow(e.clientX - lastX, 2) + Math.pow(e.clientY - lastY, 2));
            drawMirroredGeometry(lastX, lastY, e.clientX, e.clientY);

            if (speedVec > 10) {
                playHarmonicTone(e.clientX, e.clientY, speedVec);
            }

            lastX = e.clientX;
            lastY = e.clientY;
        });

        window.addEventListener('mouseup', () => isDrawing = false);

        // --- DASHBOARD ATTACHMENT HOOKS ---
        document.getElementById('slices').addEventListener('input', (e) => symmetry = parseInt(e.target.value));
        document.getElementById('thickness').addEventListener('input', (e) => brushWeight = parseFloat(e.target.value));
        document.getElementById('clearBtn').addEventListener('click', clearCanvasWithSolidBackground);

        document.getElementById('exportBtn').addEventListener('click', () => {
            try {
                const dataUrl = canvas.toDataURL('image/png');
                const downloadAnchor = document.createElement('a');
                downloadAnchor.download = `cosmic-mandala-${Date.now()}.png`;
                downloadAnchor.href = dataUrl;
                downloadAnchor.click();
            } catch (err) {
                console.error("Export failed:", err);
            }
        });
    </script>
</body>

</html>
