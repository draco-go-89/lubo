<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>music</title>
</head>

<body>
    <style>
        html,
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fff;
            position: relative;
            background-attachment: fixed;
            background-image: url('image/cat3.png'), url('image/eye2.png'), url('image/uzi.jpg'), url('image/diya.gif');
            background-repeat: no-repeat;
            background-size: 35%, 15%, 25%, 30%;
            background-position: left 20% bottom 50%, left 22% top 20%, right 20% top 30%, right 30% bottom 5%;
        }

        /* Base class for all absolute buttons */
        .img-btn {
            display: flex;
            /* Changed to flex to properly center text inside buttons */
            position: absolute;
            /* Ensures coordinate positioning works */
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            border: 1.2px solid transparent;
            border-radius: 100px;
            white-space: nowrap;
            transition: transform 0.2s ease, opacity 0.2s ease;
            opacity: 0.9;
        }

        .btn-one {
            background-image: url('image/home2.png');
            left: -0.5%;
            top: -3%;
            width: 120px;
            height: 120px;
            background-size: 75%;
        }

        .btn-six {
            background-image: url('image/portt.png');
            right: 0%;
            top: -3%;
            width: 120px;
            height: 120px;
            background-size: 92%;
        }

        /* Position tracking buttons */
        .sunflower {
            width: 25%;
            height: 13%;
            font-weight: 400;
            color: #000000;
            background-color: #e81414;
            top: 20%;
            left: 22%;
        }

        .hide {
            width: 25%;
            height: 13%;
            font-weight: 400;
            color: #160101;
            background-color: #e81414;
            top: 30%;
            right: 20%;
        }

        .selflove {
            width: 25%;
            height: 13%;
            font-weight: 400;
            color: #000000ea;
            background-color: #087dea;
            top: 50%;
            left: 20%;
        }

        .linkup {
            width: 25%;
            height: 13%;
            font-weight: 400;
            color: #000000f8;
            background-color: #0bc7dc;
            bottom: 5%;
            right: 30%;
        }
    </style>

    <a href="index.html" class="img-btn btn-one" target="_self" title="Link 1"></a>
    <a href="https://my-portfolio-rho-red-28.vercel.app/" class="img-btn btn-six" target="_self" title="Link 6"></a>

    <!-- Sun Track -->
    <div>
        <audio id="music-sun" src="image/sunflower.mp3"></audio>
        <div class="music-controls">
            <button onclick="document.getElementById('music-sun').play()" class="img-btn sunflower">sun</button>
        </div>
    </div>

    <!-- Hide Track -->
    <div>
        <audio id="music-hide" src="image/sunflower.mp3"></audio>
        <div class="music-controls">
            <button onclick="document.getElementById('music-hide').play()" class="img-btn hide">hide</button>
        </div>
    </div>

    <!-- Self Love Track -->
    <div>
        <audio id="music-selflove" src="image/sunflower.mp3"></audio>
        <div class="music-controls">
            <button onclick="document.getElementById('music-selflove').play()"
                class="img-btn selflove">selflove</button>
        </div>
    </div>

    <!-- Link Up Track -->
    <div>
        <audio id="music-linkup" src="image/sunflower.mp3"></audio>
        <div class="music-controls">
            <button onclick="document.getElementById('music-linkup').play()" class="img-btn linkup">linkup</button>
        </div>
    </div>
    <script src="analytics.bundle.js"></script> <!-- Vercel Web Analytics -->
</body>

</html>
